version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trender
      POSTGRES_PASSWORD: trenderpw
      POSTGRES_DB: trender_ai
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  web:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://trender:trenderpw@db:5432/trender_ai?schema=public
      REDIS_URL: redis://redis:6379
      CRON_SECRET: change-me
      USE_SEARCH_MV: "true"
      BASE_URL: http://localhost:3000
    depends_on: [db, redis]
    ports: ["3000:3000"]
volumes:
  db_data:
