<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Component - Vanilla HTML/CSS</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            line-height: 1.6;
        }

        /* Header styles */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease-in-out;
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
        }

        .header.scrolled {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 4rem;
        }

        /* Logo styles */
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 1.25rem;
            transition: all 0.2s ease;
        }

        .logo:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
            border-radius: 4px;
        }

        .logo-image {
            width: 5rem;
            height: 3rem;
            object-fit: contain;
        }

        @media (min-width: 768px) {
            .logo-image {
                width: 6rem;
                height: 3.5rem;
            }
        }

        /* Desktop navigation */
        .nav-desktop {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            color: #d1d5db;
            text-decoration: none;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-link:hover {
            color: #fff;
        }

        .nav-link:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #3b82f6;
            transition: width 0.2s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .btn-secondary {
            color: #d1d5db;
            background: transparent;
        }

        .btn-secondary:hover {
            color: #fff;
        }

        .btn-primary {
            color: #fff;
            background-color: #2563eb;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Mobile menu button */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: #d1d5db;
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: color 0.2s ease;
            touch-action: manipulation;
        }

        .mobile-menu-btn:hover {
            color: #ffffff;
        }

        .mobile-menu-btn:hover {
            color: #fff;
        }

        .mobile-menu-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .mobile-menu-btn svg {
            width: 1.5rem;
            height: 1.5rem;
        }

        /* Mobile menu overlay */
        .mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 40;
        }

        .mobile-overlay.active {
            display: block;
        }

        /* Mobile menu panel */
        .mobile-menu {
            position: fixed;
            top: 4rem;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(55, 65, 81, 0.5);
            transform: translateY(-100%);
            transition: transform 0.3s ease-in-out;
            z-index: 50;
        }

        .mobile-menu.active {
            transform: translateY(0);
        }

        .mobile-menu-content {
            padding: 1.5rem 1rem;
        }

        .mobile-nav-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .mobile-nav-link {
            color: #d1d5db;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 1.125rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .mobile-nav-link:hover {
            color: #fff;
        }

        .mobile-nav-link:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .mobile-actions {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(55, 65, 81, 0.5);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .mobile-btn {
            display: block;
            padding: 0.75rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 1.125rem;
            font-weight: 500;
            text-align: center;
            transition: all 0.2s ease;
        }

        .mobile-btn:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 2px;
        }

        .mobile-btn-secondary {
            color: #d1d5db;
        }

        .mobile-btn-secondary:hover {
            color: #fff;
        }

        .mobile-btn-primary {
            color: #fff;
            background-color: #2563eb;
        }

        .mobile-btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Spacer for fixed header */
        .header-spacer {
            height: 4rem;
        }

        /* Responsive design */
        @media (max-width: 767px) {
            .nav-desktop,
            .action-buttons {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }
        }

        /* Utility classes */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header" role="banner" aria-label="Main navigation">
        <div class="header-container">
            <div class="header-content">
                
                <!-- Logo -->
                <a href="/" class="logo" aria-label="Go to TrenderAI homepage">
                    <img src="https://trenderai.com/wp-content/uploads/2025/01/logo-new.png" alt="TrenderAI Logo" class="logo-image">
                </a>

                <!-- Desktop Navigation -->
                <nav class="nav-desktop" role="navigation" aria-label="Main navigation">
                    <a href="/" class="nav-link" aria-label="Navigate to Explore">Explore</a>
                    <a href="/live" class="nav-link" aria-label="Navigate to Live">Live</a>
                    <a href="/trends" class="nav-link" aria-label="Navigate to Trends">Trends</a>
                    <a href="/alerts" class="nav-link" aria-label="Navigate to Alerts">Alerts</a>
                    <a href="/resources" class="nav-link" aria-label="Navigate to Resources">Resources</a>
                    <a href="/blog" class="nav-link" aria-label="Navigate to Blog">Blog</a>
                </nav>

                <!-- Desktop Action Buttons -->
                <div class="action-buttons">
                    <a href="/login" class="btn btn-secondary" aria-label="Sign in to your account">Login</a>
                    <a href="/signup" class="btn btn-primary" aria-label="Create a new account">Get Started</a>
                </div>

                <!-- Mobile Menu Button -->
                <button 
                    class="mobile-menu-btn" 
                    aria-expanded="false" 
                    aria-controls="mobile-menu"
                    aria-label="Open navigation menu"
                    onclick="toggleMobileMenu()"
                >
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-overlay" aria-hidden="true" onclick="closeMobileMenu()"></div>

        <!-- Mobile Menu Panel -->
        <div id="mobile-menu" class="mobile-menu" role="navigation" aria-label="Mobile navigation">
            <div class="mobile-menu-content">
                <!-- Mobile Navigation Links -->
                <div class="mobile-nav-links">
                    <a href="/" class="mobile-nav-link" onclick="closeMobileMenu()" aria-label="Navigate to Explore">Explore</a>
                    <a href="/live" class="mobile-nav-link" onclick="closeMobileMenu()" aria-label="Navigate to Live">Live</a>
                    <a href="/trends" class="mobile-nav-link" onclick="closeMobileMenu()" aria-label="Navigate to Trends">Trends</a>
                    <a href="/alerts" class="mobile-nav-link" onclick="closeMobileMenu()" aria-label="Navigate to Alerts">Alerts</a>
                    <a href="/resources" class="mobile-nav-link" onclick="closeMobileMenu()" aria-label="Navigate to Resources">Resources</a>
                    <a href="/blog" class="mobile-nav-link" onclick="closeMobileMenu()" aria-label="Navigate to Blog">Blog</a>
                </div>

                <!-- Mobile Action Buttons -->
                <div class="mobile-actions">
                    <a href="/login" class="mobile-btn mobile-btn-secondary" onclick="closeMobileMenu()" aria-label="Sign in to your account">Login</a>
                    <a href="/signup" class="mobile-btn mobile-btn-primary" onclick="closeMobileMenu()" aria-label="Create a new account">Get Started</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Spacer to prevent content from being hidden behind fixed header -->
    <div class="header-spacer"></div>

    <!-- Main content -->
    <main>
        <div style="padding: 2rem; text-align: center;">
            <h1>Header Component Demo</h1>
            <p>This is a vanilla HTML/CSS version of the Header component.</p>
            <p>Try scrolling to see the header background change, and on mobile, try the hamburger menu.</p>
        </div>
    </main>

    <script>
        // Mobile menu functionality
        let isMobileMenuOpen = false;

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            updateMobileMenu();
        }

        function closeMobileMenu() {
            isMobileMenuOpen = false;
            updateMobileMenu();
        }

        function updateMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            const mobileOverlay = document.querySelector('.mobile-overlay');
            const mobileBtn = document.querySelector('.mobile-menu-btn');
            
            if (isMobileMenuOpen) {
                mobileMenu.classList.add('active');
                mobileOverlay.classList.add('active');
                mobileBtn.setAttribute('aria-expanded', 'true');
                mobileBtn.setAttribute('aria-label', 'Close navigation menu');
                document.body.style.overflow = 'hidden';
            } else {
                mobileMenu.classList.remove('active');
                mobileOverlay.classList.remove('active');
                mobileBtn.setAttribute('aria-expanded', 'false');
                mobileBtn.setAttribute('aria-label', 'Open navigation menu');
                document.body.style.overflow = 'unset';
            }
        }

        // Scroll effect for header
        function handleScroll() {
            const header = document.querySelector('.header');
            if (window.scrollY > 10) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        }

        // Escape key to close mobile menu
        function handleKeydown(event) {
            if (event.key === 'Escape' && isMobileMenuOpen) {
                closeMobileMenu();
            }
        }

        // Event listeners
        window.addEventListener('scroll', handleScroll);
        document.addEventListener('keydown', handleKeydown);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            document.body.style.overflow = 'unset';
        });
    </script>
</body>
</html>
