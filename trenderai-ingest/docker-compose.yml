version: "3.8"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trender
      POSTGRES_PASSWORD: trender
      POSTGRES_DB: trender
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:

