<!DOCTYPE html>
<html>
<head>
    <title>Sparkline Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #000; color: #fff; }
        .test-card { background: #111; border: 1px solid #222; padding: 20px; margin: 20px 0; border-radius: 16px; }
        .sparkline-container { margin: 10px 0; padding: 10px; background: #222; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Sparkline Test</h1>
    
    <div class="test-card">
        <h3>Test 1: Direct API Call</h3>
        <div id="api-result">Loading...</div>
    </div>

    <div class="test-card">
        <h3>Test 2: Sparkline Component</h3>
        <div id="sparkline-result">Loading...</div>
    </div>

    <script>
        // Test 1: Direct API call
        fetch('/api/trends/sparkline?term=artificial%20intelligence')
            .then(r => r.json())
            .then(data => {
                document.getElementById('api-result').innerHTML = 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            })
            .catch(err => {
                document.getElementById('api-result').innerHTML = 
                    `<div style="color: red;">Error: ${err.message}</div>`;
            });

        // Test 2: Check if component loads
        setTimeout(() => {
            const sparklineElements = document.querySelectorAll('[data-sparkline]');
            document.getElementById('sparkline-result').innerHTML = 
                `Found ${sparklineElements.length} sparkline elements`;
        }, 2000);
    </script>
</body>
</html>
