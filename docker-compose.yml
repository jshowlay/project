version: "3.9"
services:
  db:
    image: postgres:16
    container_name: trenderai_db
    environment:
      POSTGRES_USER: trender
      POSTGRES_PASSWORD: trenderpw
      POSTGRES_DB: trender_ai
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trender -d trender_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dbdata: